name: 타블로 영상 표현 정리

on:
  schedule:
    # 매일 한국시간 새벽 4:17 (UTC 19:17) — 새 영상이 있을 때만 분석해요
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      videos:
        description: "특정 영상만 분석 (URL 또는 ID, 쉼표로 구분 · 비우면 채널 최신 영상)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tablo_expressions.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TABLO_VIDEOS: ${{ github.event.inputs.videos }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/tablo.json
          git diff --cached --quiet || (git commit -m "타블로 영상 표현 추가" && git push)
