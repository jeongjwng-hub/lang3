name: 타블로 영상 표현 정리

on:
  schedule:
    # 2시간마다 조금씩: 대사 자세히 대기열이 있으면 5분 구간 4개(20분 분량)씩 이어서,
    # 대기열이 비었으면 채널 새 영상 1개를 핵심 표현 위주로 분석해요.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      detail:
        description: "대사 한 줄씩 자세히 분석할 영상 (URL, 대기열 맨 앞에 넣어요)"
        required: false
        default: ""
      videos:
        description: "핵심 표현만 빠르게 분석할 영상 (URL, 쉼표로 구분 · 비우면 채널 최신 영상)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tablo
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 대기하던 실행도 가장 최신 분석 결과에서 이어서 하도록
      - run: python3 tools/tablo_expressions.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  # 선택: 유튜브 챕터·영상 길이용 (없으면 AI 챕터)
          TABLO_DETAIL: ${{ github.event.inputs.detail }}
          TABLO_VIDEOS: ${{ github.event.inputs.videos }}
      - name: 결과 저장 (중간에 멈춰도 분석한 만큼은 저장)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet && exit 0
          git commit -m "타블로 영상 분석 결과 추가"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
