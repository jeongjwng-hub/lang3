name: 아침 알림

on:
  schedule:
    # GitHub 시계는 UTC(한국 -9시간)라 요일이 하루 앞당겨져요. 보통 5~15분 늦게 실행돼서 10분 일찍 예약해요.
    # 평일(월~금) 한국시간 5:30 목표 → 5:20 예약 = UTC 일~목 20:20
    - cron: "20 20 * * 0-4"
    # 주말(토·일) 한국시간 8:00 목표 → 7:50 예약 = UTC 금·토 22:50
    - cron: "50 22 * * 5,6"
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/morning_push.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
