name: 아침 알림

on:
  schedule:
    # GitHub 시계는 UTC(한국 -9시간)라 요일이 하루 앞당겨져요. 실제로는 40분쯤 늦게 와서(11/23: 5:20 예약 → 6:02 도착) 30분 일찍 예약해요.
    # 평일(월~금) 한국시간 5:00 예약 = UTC 일~목 20:00
    - cron: "0 20 * * 0-4"
    # 주말(토·일) 한국시간 7:30 예약 = UTC 금·토 22:30
    - cron: "30 22 * * 5,6"
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/morning_push.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
